name: Care Match AI Deployment

on:
  push:
    branches: [ dev ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: "20.11.1"
        cache: npm
        cache-dependency-path: client/package-lock.json

    # Build on GitHub so logs stream live (appleboy/ssh-action buffers until remote script ends)
    - name: Install and Build Client
      working-directory: client
      run: |
        npm ci --legacy-peer-deps
        npm run build
        ls -la dist

    - name: Setup SSH
      run: |
        mkdir -p ~/.ssh
        printf '%s\n' "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/deploy_key
        chmod 600 ~/.ssh/deploy_key
        ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

    - name: Deploy Server Code
      uses: appleboy/scp-action@v0.1.7
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ubuntu
        key: ${{ secrets.EC2_SSH_KEY }}
        source: "server/*"
        target: "/home/ubuntu/care-match-ai/server"
        strip_components: 1
        overwrite: true

    - name: Deploy Client Build
      uses: appleboy/scp-action@v0.1.7
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ubuntu
        key: ${{ secrets.EC2_SSH_KEY }}
        source: "client/dist"
        target: "/home/ubuntu/care-match-ai/client"
        strip_components: 1
        overwrite: true

    # Native SSH streams logs live (unlike appleboy/ssh-action)
    - name: Install Server Deps and Restart
      run: |
        ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes ubuntu@"${{ secrets.EC2_HOST }}" << 'EOF'
          set -e
          echo "==> Installing server dependencies..."
          cd /home/ubuntu/care-match-ai/server
          rm -f package-lock.json
          yarn install --production --frozen-lockfile
          echo "==> Restarting PM2..."
          pm2 delete care-match-server || true
          NODE_ENV=production PORT=3002 pm2 start index.js --name "care-match-server" --cwd /home/ubuntu/care-match-ai/server
          pm2 save
          sleep 2
          pm2 list
          curl -sf http://localhost:3002/ > /dev/null
          test -d /home/ubuntu/care-match-ai/client/dist
          echo "✅ Deployment completed successfully!"
        EOF
