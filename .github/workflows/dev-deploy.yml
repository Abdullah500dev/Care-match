name: Care Match AI Deployment

on:
  push:
    branches: [ dev ]
  pull_request:
    branches: [ dev ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/dev'

    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.11.1'

    - name: Enable Corepack
      run: corepack enable

    - name: Install Server Dependencies
      run: |
        cd server
        rm -f package-lock.json
        yarn install

    - name: Install Client Dependencies and Build
      run: |
        cd client
        yarn install
        yarn build

    - name: Deploy Server to Server
      uses: appleboy/scp-action@v0.1.7
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ubuntu
        key: ${{ secrets.EC2_SSH_KEY }}
        source: "server/*"
        target: "/home/ubuntu/care-match-ai/server"
        strip_components: 1

    - name: Prepare client dist directory on server
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ubuntu
        key: ${{ secrets.EC2_SSH_KEY }}
        script_stop: true
        script: mkdir -p /home/ubuntu/care-match-ai/client/dist

    - name: Deploy Client Build to Server
      uses: appleboy/scp-action@v0.1.7
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ubuntu
        key: ${{ secrets.EC2_SSH_KEY }}
        source: "client/dist/**"
        target: "/home/ubuntu/care-match-ai/client/dist"
        strip_components: 2

    - name: Install Dependencies and Restart Services
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ubuntu
        key: ${{ secrets.EC2_SSH_KEY }}
        script_stop: true
        script: |
          # Navigate to project directory
          cd /home/ubuntu/care-match-ai

          # Server setup
          cd server
          rm -f package-lock.json
          yarn install --frozen-lockfile

          # Restart PM2 app — env must be set via ecosystem (inline PORT=… is not passed to the app)
          pm2 delete care-match-server || true
          pm2 flush care-match-server || true
          sleep 2

          cat > /home/ubuntu/care-match-ai/server/ecosystem.config.cjs <<'EOF'
          module.exports = {
            apps: [
              {
                name: "care-match-server",
                script: "index.js",
                cwd: "/home/ubuntu/care-match-ai/server",
                instances: 1,
                exec_mode: "fork",
                env: {
                  NODE_ENV: "production",
                  PORT: "3002",
                },
              },
            ],
          };
          EOF

          if ! pm2 start /home/ubuntu/care-match-ai/server/ecosystem.config.cjs; then
            echo "❌ Failed to start server"
            pm2 logs care-match-server --lines 80 --nostream || true
            exit 1
          fi

          # Wait for listen
          sleep 8
          pm2 save

    - name: Verify Deployment
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ubuntu
        key: ${{ secrets.EC2_SSH_KEY }}
        script_stop: true
        script: |
          # Check PM2 status
          pm2 list

          # Verify server is running
          if ! pm2 list | grep -q "care-match-server"; then
            echo "❌ Server is not running"
            exit 1
          fi

          # Health check with retries (PORT=3002 via ecosystem)
          HEALTH_OK=0
          for i in 1 2 3 4 5 6 7 8; do
            if curl -sf "http://127.0.0.1:3002/health" >/dev/null; then
              HEALTH_OK=1
              break
            fi
            echo "Waiting for health endpoint… attempt $i"
            sleep 2
          done

          if [ "$HEALTH_OK" -ne 1 ]; then
            echo "❌ Server health check failed on port 3002"
            echo "--- pm2 describe ---"
            pm2 describe care-match-server || true
            echo "--- recent logs ---"
            pm2 logs care-match-server --lines 100 --nostream || true
            echo "--- listening ports ---"
            ss -tlnp | grep -E '3002|node' || netstat -tlnp 2>/dev/null | grep -E '3002|node' || true
            exit 1
          fi

          # Verify client build
          if [ ! -f "/home/ubuntu/care-match-ai/client/dist/index.html" ]; then
            echo "❌ Client dist/index.html not found"
            exit 1
          fi

          echo "✅ Server is running and healthy"
          echo "🎉 Deployment completed successfully!"
          exit 0