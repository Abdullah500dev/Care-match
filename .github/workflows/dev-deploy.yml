name: Care Match AI Deployment

on:
  push:
    branches: [ dev ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Deploy Server to Server
      uses: appleboy/scp-action@v0.1.7
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ubuntu
        key: ${{ secrets.EC2_SSH_KEY }}
        source: "server/*"
        target: "/home/ubuntu/care-match-ai/server"
        strip_components: 1
        overwrite: true

    - name: Deploy Client to Server
      uses: appleboy/scp-action@v0.1.7
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ubuntu
        key: ${{ secrets.EC2_SSH_KEY }}
        source: "client/*"
        target: "/home/ubuntu/care-match-ai/client"
        strip_components: 1
        overwrite: true

    # Split SSH steps so each prints logs when it finishes (ssh-action buffers until the script ends)
    - name: Install Server Dependencies
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ubuntu
        key: ${{ secrets.EC2_SSH_KEY }}
        command_timeout: 20m
        request_pty: true
        script: |
          set -e
          echo "==> Installing server dependencies..."
          cd /home/ubuntu/care-match-ai/server
          rm -f package-lock.json
          yarn install --production --frozen-lockfile
          echo "==> Server dependencies done"

    - name: Restart Server (PM2)
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ubuntu
        key: ${{ secrets.EC2_SSH_KEY }}
        command_timeout: 5m
        request_pty: true
        script: |
          set -e
          echo "==> Restarting care-match-server..."
          pm2 delete care-match-server || true
          cd /home/ubuntu/care-match-ai/server
          NODE_ENV=production PORT=3002 pm2 start index.js --name "care-match-server" --cwd /home/ubuntu/care-match-ai/server
          pm2 save
          sleep 2
          pm2 list
          curl -sf http://localhost:3002/ > /dev/null
          echo "==> Server is up on :3002"

    - name: Install Client Dependencies and Build
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ubuntu
        key: ${{ secrets.EC2_SSH_KEY }}
        command_timeout: 30m
        request_pty: true
        script: |
          set -e
          echo "==> Installing client dependencies..."
          cd /home/ubuntu/care-match-ai/client
          rm -f package-lock.json
          yarn install --frozen-lockfile
          echo "==> Building client..."
          rm -rf dist
          yarn build
          echo "==> Client build done"
          ls -la dist | head -20

    - name: Verify Deployment
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ubuntu
        key: ${{ secrets.EC2_SSH_KEY }}
        command_timeout: 2m
        script: |
          set -e
          pm2 list | grep -q "care-match-server"
          curl -sf http://localhost:3002/ > /dev/null
          test -d /home/ubuntu/care-match-ai/client/dist
          echo "✅ Deployment completed successfully!"
