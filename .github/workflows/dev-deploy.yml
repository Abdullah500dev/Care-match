name: Care Match AI Deployment

on:
  push:
    branches: [ dev ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Deploy Server to Server
      uses: appleboy/scp-action@v0.1.7
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ubuntu
        key: ${{ secrets.EC2_SSH_KEY }}
        source: "server/*"
        target: "/home/ubuntu/care-match-ai/server"
        strip_components: 1

    - name: Deploy Client to Server
      uses: appleboy/scp-action@v0.1.7
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ubuntu
        key: ${{ secrets.EC2_SSH_KEY }}
        source: "client/*"
        target: "/home/ubuntu/care-match-ai/client"
        strip_components: 1

    - name: Install Dependencies and Restart Services
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ubuntu
        key: ${{ secrets.EC2_SSH_KEY }}
        script: |
          cd /home/ubuntu/care-match-ai

          # Server setup
          cd server
          rm -f package-lock.json
          yarn install --frozen-lockfile

          pm2 delete care-match-server || true
          pm2 flush care-match-server || true
          sleep 5

          cd /home/ubuntu/care-match-ai/server
          if ! NODE_ENV=production PORT=3002 pm2 start index.js --name "care-match-server" --cwd /home/ubuntu/care-match-ai/server; then
            echo "❌ Failed to start server"
            exit 1
          fi

          sleep 5

          # Client setup
          cd ../client
          rm -f package-lock.json
          yarn install --frozen-lockfile
          rm -rf dist
          yarn build

          pm2 save

          # Verify deployment
          pm2 list

          if ! pm2 list | grep -q "care-match-server"; then
            echo "❌ Server is not running"
            exit 1
          fi

          if ! curl -s http://localhost:3002/ > /dev/null; then
            echo "❌ Server health check failed on port 3002"
            exit 1
          fi

          if [ ! -d "/home/ubuntu/care-match-ai/client/dist" ]; then
            echo "❌ Client dist folder not found"
            exit 1
          fi

          echo "✅ Server is running and healthy"
          echo "🎉 Deployment completed successfully!"
